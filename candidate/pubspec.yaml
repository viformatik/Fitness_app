name: fitness_tracker
description: Приложение для отслеживания питания, тренировок и веса с рецептами, аналитикой и напоминаниями
publish_to: 'none'
version: 3.0.1+4

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive_flutter: ^1.1.0
  supabase_flutter: ^2.10.0
  image_picker: ^1.2.0
  image: ^4.5.4
  speech_to_text: ^7.3.0
  file_picker: ^10.3.0
  share_plus: ^12.0.0
  # Direct dependency: the web-only backup download fallback imports package:web.
  web: ^1.1.2
  http: ^1.5.0
  shared_preferences: ^2.2.2
  fl_chart: ^0.68.0
  provider: ^6.1.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Hive 2.2.3's web backend resolved writes on request success rather than
# transaction completion. This pinned Apache-2.0 copy contains a narrowly
# scoped fix; see third_party/hive/FITNESS_PATCH.md. No schema change.
dependency_overrides:
  hive:
    path: third_party/hive

flutter:
  uses-material-design: true
  # Bundle the actual Cyrillic-capable fallback, not only icon fonts. This
  # keeps the first offline restart readable without a Google Fonts request.
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/fallback/Roboto-Regular.ttf
  assets:
    - fonts/fallback/Roboto_LICENSE.txt
